name: Informe360 CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify-web-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test lockfile normalizer
        run: node --test scripts/normalize-lock-registry.test.mjs

      - name: Normalize lockfile registry URLs
        run: node scripts/normalize-lock-registry.mjs

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Run web + HSE QA
        run: npm run qa

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck native mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Bundle Android pilot
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist
