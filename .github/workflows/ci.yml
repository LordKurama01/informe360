name: Informe360 CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test lockfile normalizer
        run: node --test scripts/normalize-lock-registry.test.mjs

      - name: Normalize lockfile registry URLs
        run: node scripts/normalize-lock-registry.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full QA
        run: npm run qa
